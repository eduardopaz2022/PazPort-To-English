<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Teacher Audio</title>
<style>
  body { font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
  .card { background: #1e293b; border-radius: 16px; padding: 32px; max-width: 520px; width: 100%; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,.4); }
  h1 { font-size: 1.4rem; margin: 0 0 6px; }
  p { color: #94a3b8; margin: 6px 0 18px; }
  input[type=password] { width: 100%; padding: 12px; border-radius: 8px; border: 2px solid #334155; background: #0f172a; color: #fff; font-size: 1rem; box-sizing: border-box; margin-bottom: 12px; }
  button { padding: 14px 24px; border: 0; border-radius: 10px; font-size: 1.05rem; font-weight: bold; cursor: pointer; margin: 6px; color: #fff; background: #2563eb; }
  button:disabled { background: #475569; cursor: wait; }
  audio { width: 100%; margin: 10px 0 16px; }
  .hidden { display: none; }
  .count { font-size: 2.2rem; font-weight: bold; color: #fff; }
</style>
</head>
<body>
<div class="card">
  <div id="lock">
    <h1>🔒 Teacher Audio</h1>
    <p>Enter the teacher password to load the exam audio.</p>
    <input type="password" id="pw" placeholder="Password" autocomplete="off">
    <button id="open">Open</button>
    <div id="err" style="color:#f87171; min-height:1.4em;"></div>
  </div>
  <div id="player" class="hidden">
    <h1>🎧 Recovery Exam 11th · Part 1 Listening</h1>
    <p>Connect the speakers and press play. Play it <b>two times</b>.</p>
    <audio id="audio" controls controlsList="nodownload"></audio>
    <p>Times played: <span class="count" id="count">0</span></p>
  </div>
</div>
<script>
function norm(t) { return t.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
document.getElementById('open').onclick = unlock;
document.getElementById('pw').onkeydown = function(e) { if (e.key === 'Enter') unlock(); };
function unlock() {
  var pw = norm(document.getElementById('pw').value), err = document.getElementById('err'), btn = document.getElementById('open');
  if (!window.crypto || !crypto.subtle) { err.textContent = 'Open this page with https in Google Chrome.'; return; }
  btn.disabled = true; btn.textContent = 'Loading…'; err.textContent = '';
  var fail = function(msg) { btn.disabled = false; btn.textContent = 'Open'; err.textContent = msg; };
  fetch('exam-audio.bin').then(function(r) { if (!r.ok) throw new Error('net'); return r.arrayBuffer(); }).then(function(buf) {
    var all = new Uint8Array(buf), salt = all.slice(0, 16), iv = all.slice(16, 28), data = all.slice(28);
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']).then(function(k) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: 150000, hash: 'SHA-256' }, k, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    }).then(function(key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, data); });
  }).then(function(plain) {
    var audio = document.getElementById('audio'), plays = 0;
    audio.src = URL.createObjectURL(new Blob([plain], { type: 'audio/mpeg' }));
    audio.onended = function() { plays++; document.getElementById('count').textContent = plays; };
    document.getElementById('lock').classList.add('hidden'); document.getElementById('player').classList.remove('hidden');
  }).catch(function(e) { fail(e && e.message === 'net' ? 'Could not download the audio. Check your internet.' : 'Wrong password.'); });
}
</script>
</body>
</html>
