<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pazport - Plataforma Educativa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 24px; margin-bottom: 20px; }
        .btn-blue { background-color: #2563eb; color: white; padding: 10px 20px; border-radius: 8px; font-weight: 600; }
        .audio-player { width: 100%; margin-top: 10px; padding: 15px; background: #eff6ff; border-radius: 8px; border: 1px solid #bfdbfe; }
    </style>
</head>
<body class="p-6">

    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-blue-900 mb-8">Pazport - Bachillerato & Noveno</h1>

        <div class="card">
            <h2 class="text-lg font-bold mb-4 text-gray-700">Selecciona tu nivel:</h2>
            <select id="gradeSelect" class="w-full p-3 border rounded-lg mb-4">
                <option value="9th">Noveno Grado (Práctica Part 1, 2 y 3)</option>
                <option value="10th">Décimo - Mock Exam (30 Preguntas)</option>
                <option value="11th">Onceavo - Mock Exam (30 Preguntas)</option>
            </select>
            <button onclick="renderPlatform()" class="w-full btn-blue hover:bg-blue-700 transition">Cargar Módulo</button>
        </div>

        <div id="contentArea" class="hidden">
            <div id="audioContainer" class="card hidden">
                <h3 class="font-bold text-blue-800">🎧 Listening Section:</h3>
                <div class="audio-player" id="audioPlayer"></div>
            </div>
            
            <div id="mainQuiz" class="card"></div>
        </div>
    </div>

    <script>
        // Enlaces de tus audios en Drive
        const audioLinks = {
            "10th": "https://docs.google.com/uc?export=download&id=18RXYY6EMlExuMW9Q5-XsFbAo39JNPo2J",
            "11th": "https://docs.google.com/uc?export=download&id=1ylNOpRvdGVOptD9UFOrULEfX5-DeeLbB"
        };

        function renderPlatform() {
            const selection = document.getElementById('gradeSelect').value;
            const content = document.getElementById('contentArea');
            const audioDiv = document.getElementById('audioContainer');
            const audioPlayer = document.getElementById('audioPlayer');
            const mainQuiz = document.getElementById('mainQuiz');

            content.classList.remove('hidden');

            if(selection.includes('Exam')) {
                audioDiv.classList.remove('hidden');
                const grade = selection.split('-')[0];
                audioPlayer.innerHTML = `<audio controls class="w-full"><source src="${audioLinks[grade]}" type="audio/mpeg"></audio>`;
                mainQuiz.innerHTML = `<p class="text-gray-600">Bienvenido al Mock Exam de 30 preguntas. Lee con atención y utiliza el audio de arriba.</p>`;
            } else {
                audioDiv.classList.add('hidden');
                mainQuiz.innerHTML = `
                    <h3 class="text-xl font-bold mb-4">Noveno Grado - Unidad 4</h3>
                    <div class="space-y-4">
                        <button class="w-full text-left p-4 border rounded hover:bg-gray-50">Part 1: Vocabulary</button>
                        <button class="w-full text-left p-4 border rounded hover:bg-gray-50">Part 2: Adverbs of Manner</button>
                        <button class="w-full text-left p-4 border rounded hover:bg-gray-50">Part 3: Integrated Practice</button>
                    </div>`;
            }
        }
    </script>
</body>
</html>
