<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">

<meta name="theme-color" content="#0F2D63">
<title>Pazport to English · Beta</title>
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--side:#0F2D63;--blue:#1F5FD1;--blue-d:#1747A6;--sky:#38BDF8;--bg:#EEF4FC;--card:#fff;--ink:#0F2347;--muted:#5B6B84;--line:#DCE6F3;--gold:#E0A526;--gold-l:#FFF4DB;--green:#16A36A;--green-l:#DDF6EA;--red:#E1484C;--red-l:#FDE4E4;--violet:#7C5CE0;--violet-l:#ECE6FD;--orange:#E0861F;--orange-l:#FFEFD9}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:Manrope,sans-serif;color:var(--ink);min-height:100vh}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}
/* login */
.login{display:grid;grid-template-columns:1.15fr 1fr;min-height:100vh}
.lpanel{background:linear-gradient(140deg,#0B2350,#1747A6 60%,#2C8BE6);color:#fff;padding:56px 64px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.lpanel:before{content:'';position:absolute;width:520px;height:520px;border-radius:50%;border:70px solid rgba(255,255,255,.05);right:-200px;bottom:-200px}
.lpanel h1{font-family:Fraunces,serif;font-size:3rem;line-height:1.1;margin:auto 0 18px}
.lpanel p{font-size:1.1rem;opacity:.88;max-width:470px;line-height:1.55}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:34px;max-width:560px}
.feat div{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center;font-weight:700}
.feat i{color:var(--sky);font-size:1.2rem}
.lform{display:flex;align-items:center;justify-content:center;padding:40px 16px}
.lbox{background:#fff;border:1px solid var(--line);border-radius:22px;padding:40px 32px;width:100%;max-width:420px;text-align:center;box-shadow:0 18px 40px rgba(15,45,99,.08)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:14px;border:1.5px solid #c9d3de;border-radius:999px;background:#fff;font-weight:800;font-size:1rem;margin-top:24px}
.gbtn:hover{background:#f6f9fd}
.note{margin-top:16px;padding:12px 14px;border-radius:12px;font-size:.88rem;text-align:left;line-height:1.45;word-break:break-word;user-select:text}
.note.err{background:var(--red-l);color:#8d2c2f}.note.ok{background:var(--green-l);color:#0d6b45}
/* shell */
.app{display:grid;grid-template-columns:248px 1fr 320px;min-height:100vh}
.app.noaside{grid-template-columns:248px 1fr}
.side{background:linear-gradient(180deg,var(--side),#0B2350);color:#C9D7F2;padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 22px;color:#fff}
.brand img{width:40px;height:40px}
.brand b{font-family:Fraunces,serif;font-size:1.12rem;line-height:1.1;display:block}
.brand small{display:block;font-size:.66rem;letter-spacing:2px;color:var(--sky);text-transform:uppercase;font-weight:700;margin-top:2px}
.nav{display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:12px;font-weight:700;font-size:.95rem;color:#C9D7F2;background:none;border:none;text-align:left;width:100%}
.nav i{width:22px;text-align:center;font-size:1.05rem}
.nav:hover{background:rgba(255,255,255,.06)}
.nav.on{background:var(--blue);color:#fff;box-shadow:0 6px 16px rgba(31,95,209,.45)}
.nav .pill{margin-left:auto;background:var(--gold);color:#3b2a00;font-size:.7rem;padding:2px 8px;border-radius:999px}
.sep{height:1px;background:rgba(255,255,255,.1);margin:10px 6px}
.switch{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;border-radius:12px;border:1.5px dashed rgba(255,255,255,.35);background:rgba(56,189,248,.12);color:#fff;font-weight:800;font-size:.9rem}
.switch:hover{background:rgba(56,189,248,.22)}
.me{display:flex;gap:10px;align-items:center;padding:12px;border-radius:12px;background:rgba(255,255,255,.06);margin-top:8px}
.side .switch + .me{margin-top:8px}
.side:not(:has(.switch:not(.hidden))) .me{margin-top:auto}
.av{width:38px;height:38px;border-radius:50%;background:var(--sky);color:#06264f;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.me b{color:#fff;font-size:.88rem;display:block;max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.me span{font-size:.74rem}
.me .out{margin-left:auto;background:none;border:none;color:#C9D7F2;font-size:1rem}
main{padding:28px 32px 40px;display:flex;flex-direction:column;gap:22px;min-width:0}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font-size:1.55rem;font-weight:800}
.top .sub{color:var(--muted);font-size:.9rem}
.top .right{margin-left:auto;display:flex;gap:10px;align-items:center}
.select{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font:700 .9rem Manrope,sans-serif;color:var(--ink)}
.viewbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:#FFF4DB;border:1px solid #F5D98C;color:#7a5410;border-radius:14px;padding:10px 14px;font-weight:700;font-size:.88rem}
.viewbar button{margin-left:auto;background:#fff;border:1px solid #F5D98C;border-radius:10px;padding:6px 12px;font-weight:800;color:#7a5410}
.hero{border-radius:20px;padding:26px 30px;color:#fff;background:linear-gradient(120deg,#1747A6 0%,#1F5FD1 55%,#38A9F0 100%);display:flex;align-items:center;gap:24px;position:relative;overflow:hidden}
.hero:before{content:'';position:absolute;right:-60px;top:-80px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero h2{font-size:1.6rem;font-weight:800;margin-bottom:6px}
.hero p{opacity:.92;max-width:520px;line-height:1.5}
.cta{display:inline-flex;align-items:center;gap:10px;margin-top:16px;background:#fff;color:var(--blue-d);font-weight:800;padding:12px 20px;border-radius:12px;box-shadow:0 6px 0 rgba(0,0,0,.12);border:none;font-size:1rem}
.hero .big{margin-left:auto;font-size:5.5rem;color:#FFD66B;position:relative;filter:drop-shadow(0 8px 12px rgba(0,0,0,.2))}
.sec-t{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-t h3{font-size:1.1rem;font-weight:800}.sec-t span{color:var(--muted);font-size:.85rem}
.sec-t a,.sec-t button.link{margin-left:auto;color:var(--blue);font-weight:700;font-size:.85rem;background:none;border:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.mtop{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.task{display:flex;gap:14px;align-items:center}
.ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.25rem;flex:none}
.task b{display:block;font-size:.98rem}.task small{color:var(--muted);font-size:.82rem}
.tag{margin-left:auto;font-size:.75rem;font-weight:800;padding:5px 10px;border-radius:999px;white-space:nowrap}
.demo{display:inline-block;font-size:.66rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;background:#EEF2F8;color:var(--muted);padding:3px 8px;border-radius:999px;vertical-align:middle}
.tile{border-radius:18px;padding:18px;border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;gap:10px;min-height:168px;text-align:left;color:var(--ink)}
button.tile:hover{border-color:var(--blue);box-shadow:0 10px 18px rgba(15,45,99,.08)}
.tile .ic{width:54px;height:54px;font-size:1.4rem}
.tile b{font-size:1rem}.tile small{color:var(--muted);font-size:.8rem}
.bar{height:8px;border-radius:8px;background:#E6EEF8;margin-top:auto}.bar i{display:block;height:8px;border-radius:8px}
aside{background:#fff;border-left:1px solid var(--line);padding:26px 22px;display:flex;flex-direction:column;gap:18px}
.streak{border-radius:18px;background:linear-gradient(135deg,#FFF4DB,#FFE6A8);padding:18px;border:1px solid #F5D98C}
.streak .n{font-size:2.4rem;font-weight:800;color:#B7791F;display:flex;align-items:center;gap:10px}
.week{display:flex;justify-content:space-between;margin-top:12px}
.week div{text-align:center;font-size:.7rem;font-weight:700;color:#8a6a1e}
.week i{display:flex;width:30px;height:30px;border-radius:50%;align-items:center;justify-content:center;margin-bottom:4px;background:#fff;color:#e5d3a3}
.week .y i{background:var(--gold);color:#fff}
.ring{display:flex;align-items:center;gap:16px}
.mini{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.mini:last-child{border:none}
.mini b{font-size:.9rem;display:block}.mini small{color:var(--muted);font-size:.78rem}
.mini .v{margin-left:auto;font-weight:800}
.extra{border-radius:16px;background:var(--side);color:#fff;padding:16px;display:flex;gap:12px;align-items:center}
.extra .ic{background:rgba(255,255,255,.12);color:var(--gold)}
/* practice */
.qwrap{max-width:820px;width:100%;margin:0 auto}
.steps{display:flex;gap:6px;margin-bottom:20px}
.steps div{flex:1;height:10px;border-radius:10px;background:#DCE6F3}
.steps .d{background:var(--green)}.steps .x{background:var(--red)}.steps .c{background:var(--blue)}
.qcard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:32px 34px;box-shadow:0 18px 40px rgba(15,45,99,.08)}
.qcard .lbl{font-size:.78rem;font-weight:800;letter-spacing:1.5px;color:var(--blue);text-transform:uppercase}
.qcard h2{font-size:1.55rem;margin:10px 0 22px;font-weight:800;line-height:1.3}
.opt{display:flex;align-items:center;gap:14px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:15px 18px;font-weight:700;font-size:1.02rem;margin-bottom:12px;background:#fff;width:100%;text-align:left;color:var(--ink)}
.opt:hover{border-color:#B9CBE6}
.opt .k{width:32px;height:32px;border-radius:9px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.85rem;color:var(--muted);flex:none}
.opt.good{border-color:var(--green);background:var(--green-l)}.opt.good .k{background:var(--green);border-color:var(--green);color:#fff}
.opt.bad{border-color:var(--red);background:var(--red-l)}.opt.bad .k{background:var(--red);border-color:var(--red);color:#fff}
.feedback{margin-top:8px;padding:12px 14px;border-radius:12px;font-weight:700;font-size:.92rem}
.btnrow{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:12px;flex-wrap:wrap}
.btn{background:var(--blue);color:#fff;font-weight:800;padding:14px 26px;border-radius:14px;box-shadow:0 5px 0 var(--blue-d);font-size:1rem;border:none}
.btn.green{background:var(--green);box-shadow:0 5px 0 #0f7a4f}
.btn.red{background:#fff;color:var(--red);border:2px solid #F3B9BA;box-shadow:0 5px 0 #F3B9BA}
.btn.ghost{background:#EEF2F8;color:var(--ink);box-shadow:none}
.flash{perspective:1200px;height:300px;cursor:pointer}
.flash .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flash.flip .in{transform:rotateY(180deg)}
.flash .f,.flash .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;border:1px solid var(--line);box-shadow:0 18px 40px rgba(15,45,99,.08)}
.flash .f{background:#fff}
.flash .f .em{font-size:3.4rem}.flash .f .term{font-size:2.2rem;font-weight:800;margin-top:8px}
.flash .b{background:linear-gradient(140deg,#F3F8FF,#E3EDFF);transform:rotateY(180deg);gap:10px}
.flash .b .es{font-size:1.4rem;font-weight:800;color:var(--blue-d)}
.flash .b .ex{color:var(--muted);font-style:italic}
.speak{background:#EEF4FF;border:none;color:var(--blue);border-radius:10px;padding:8px 12px;font-weight:800}
/* teacher */
.kpi b{font-size:1.9rem;font-weight:800;display:block}.kpi small{color:var(--muted);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;color:var(--muted);font-weight:700;font-size:.74rem;text-transform:uppercase;letter-spacing:.8px;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:12px;border-bottom:1px solid var(--line)}
.tscroll{overflow-x:auto}
.hb{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:.85rem}
.hb span:first-child{width:34px;color:var(--muted);font-weight:700}
.hb .t{flex:1;height:14px;border-radius:7px;background:#EEF2F8}.hb .t i{display:block;height:14px;border-radius:7px}
.hb .p{width:44px;text-align:right;font-weight:800}
.sw{display:inline-flex;width:40px;height:22px;border-radius:999px;background:var(--green);position:relative;border:none}
.sw:after{content:'';position:absolute;right:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.sw.off{background:#C9D3E0}.sw.off:after{right:21px}
.empty{color:var(--muted);text-align:center;padding:24px;font-size:.92rem}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;font-size:.9rem;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.mnav{display:none}
.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:700;gap:10px}
/* responsive */
@media (max-width:1180px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.app{grid-template-columns:248px 1fr}.app aside{grid-column:2;border-left:none;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}}
@media (max-width:860px){
 .login{grid-template-columns:1fr}.lpanel{padding:32px 20px}.lpanel h1{font-size:2.1rem;margin-top:24px}.feat{grid-template-columns:1fr}
 .app,.app.noaside{grid-template-columns:1fr}
 .side{display:none}
 .mtop{display:flex;align-items:center;gap:10px;margin-bottom:-6px}.mtop img{width:34px}.mtop b{font-family:Fraunces,serif}.mtop .av{width:32px;height:32px;margin-left:auto;font-size:.8rem}
 .app aside{grid-column:1}
 main{padding:18px 16px 96px}
 .hero{padding:20px}.hero .big{font-size:3.4rem}.hero h2{font-size:1.25rem}
 .mnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);justify-content:space-around;padding:8px 0 14px;z-index:40}
 .mnav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.68rem;font-weight:700;color:var(--muted);background:none;border:none;padding:4px 6px}
 .mnav i{font-size:1.2rem}.mnav .on{color:var(--blue)}
 .qcard{padding:22px 18px}.qcard h2{font-size:1.25rem}
 .top .right{margin-left:0;width:100%}
}
</style>

<script src="content.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, getDocs, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Public web config (not a secret; access is controlled by the Firestore rules)
const firebaseConfig = {
  apiKey: "AIzaSyAdYVdiMcb4JVyKngwsZ7m7T906xZ7y4CI",
  authDomain: "pazport-6a9f8.firebaseapp.com",
  projectId: "pazport-6a9f8",
  storageBucket: "pazport-6a9f8.firebasestorage.app",
  messagingSenderId: "881514411279",
  appId: "1:881514411279:web:7c3de24d76eb9349ee7a7a"
};
const SCHOOL_DOMAIN = "citala.edu.sv";
const STREAK_FOR_POINT = 7;
const BOX_DAYS = [0, 1, 3, 7, 14, 30];

const fb = initializeApp(firebaseConfig);
const auth = getAuth(fb);
const db = getFirestore(fb);
const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: "select_account" });

/* ---------- helpers ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const today = () => new Date().toLocaleDateString("en-CA");
const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.toLocaleDateString("en-CA"); };
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const firstName = (n) => String(n || "").split(" ")[0] || "there";
const initials = (n) => String(n || "?").split(" ").filter(Boolean).slice(0, 2).map(x => x[0]).join("").toUpperCase();
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.remove("hidden"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.add("hidden"), 2600); }
function speak(t) { try { const u = new SpeechSynthesisUtterance(t); u.lang = "en-US"; u.rate = .9; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {} }
window.speak = speak;
const greeting = () => { const h = new Date().getHours(); return h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening"; };

/* group the units of a grade into topics ("Not Feeling Good - Block 1" + "Block 2" = one topic) */
function topics(grade) {
  const out = [];
  for (const u of (window.STUDY[grade] || [])) {
    const name = u.n.replace(/ - Block \d+$/, "");
    let t = out.find(x => x.name === name);
    if (!t) { t = { name, words: [], quiz: [] }; out.push(t); }
    for (const w of u.w) if (!t.words.some(x => x.t.toLowerCase() === w.t.toLowerCase())) t.words.push(w);
    t.quiz.push(...u.q.filter(q => q.o && q.o.length > 1 && Number.isInteger(q.a)));
  }
  return out.filter(t => t.words.length || t.quiz.length);
}
const TOPIC_STYLE = [["fa-brain", "#1F5FD1", "#E3EDFF"], ["fa-yin-yang", "#7C5CE0", "#ECE6FD"], ["fa-book-open", "#16A36A", "#DDF6EA"], ["fa-headphones", "#E0861F", "#FFEFD9"], ["fa-spell-check", "#E1484C", "#FDE4E4"], ["fa-comments", "#0E9BB5", "#DDF4F8"]];

/* ---------- state ---------- */
const S = { user: null, teacher: false, mode: "student", view: "home", grade: "9", prog: null, practice: null, students: null };

function blankProgress(u) { return { name: u.displayName || "", email: u.email || "", grade: "", days: [], boxes: {}, answered: 0, correct: 0, minutes: 0 }; }
async function loadProgress() {
  try {
    const snap = await getDoc(doc(db, "progress", S.user.uid));
    S.prog = Object.assign(blankProgress(S.user), snap.exists() ? snap.data() : {});
  } catch (e) { S.prog = blankProgress(S.user); toast("Could not read your progress (" + e.code + ")"); }
  if (S.prog.grade) S.grade = S.prog.grade;
}
let saveTimer = null;
function saveProgress(now) {
  clearTimeout(saveTimer);
  const run = async () => {
    try {
      const p = S.prog;
      await setDoc(doc(db, "progress", S.user.uid), {
        name: S.user.displayName || "", email: S.user.email, grade: p.grade || "", days: p.days.slice(-60),
        boxes: p.boxes, answered: p.answered, correct: p.correct, minutes: p.minutes, lastActive: serverTimestamp()
      });
    } catch (e) { toast("Not saved (" + e.code + "). Check the Firestore rules."); }
  };
  if (now) return run(); saveTimer = setTimeout(run, 1500);
}
function markToday() { const t = today(); if (!S.prog.days.includes(t)) S.prog.days.push(t); }
function streak(days) {
  const set = new Set(days || []); let d = today(); if (!set.has(d)) d = addDays(d, -1);
  let n = 0; while (set.has(d)) { n++; d = addDays(d, -1); } return n;
}
function wordKey(w) { return w.t.toLowerCase(); }
function dueWords(grade) {
  const all = topics(grade).flatMap(t => t.words.map(w => ({ ...w, topic: t.name })));
  const t = today();
  const due = all.filter(w => { const b = S.prog.boxes[wordKey(w)]; return b && b.d <= t && b.b < 5; });
  const fresh = all.filter(w => !S.prog.boxes[wordKey(w)]);
  return { all, due, fresh };
}

window.openTopic = (i) => { S.topic = i; S.view = "topic"; render(); window.scrollTo(0, 0); };
window.startReview = () => {
  const { due, fresh } = dueWords(S.grade);
  const items = shuffle(due).slice(0, 15).concat(fresh.slice(0, Math.max(0, 10 - due.length)));
  if (!items.length) return toast("Nothing to review today. Great job!");
  S.practice = { kind: "cards", title: "Today's review", items, i: 0, known: 0 }; S.view = "practice"; render();
};
window.startCards = (ti) => { const t = topics(S.grade)[ti]; S.practice = { kind: "cards", title: t.name, items: shuffle(t.words), i: 0, known: 0, back: ti }; S.view = "practice"; render(); };
function quizItems(list) { return shuffle(list).slice(0, 10).map(q => { const opts = q.o.map((o, k) => ({ o, ok: k === q.a })); return { q: q.q, opts: shuffle(opts), h: q.h }; }); }
window.startQuiz = (ti) => { const t = topics(S.grade)[ti]; S.practice = { kind: "quiz", title: t.name, items: quizItems(t.quiz), i: 0, score: 0, res: [], back: ti }; S.view = "practice"; render(); };
window.startMixedQuiz = () => { const all = topics(S.grade).flatMap(t => t.quiz); S.practice = { kind: "quiz", title: "Mixed quiz", items: quizItems(all), i: 0, score: 0, res: [] }; S.view = "practice"; render(); };

function countAnswer(ok) { S.prog.answered++; if (ok) S.prog.correct++; S.todayDone = (S.todayDone || 0) + 1; markToday(); saveProgress(); }

function renderPractice() {
  const P = S.practice; if (!P) return PAGES.study();
  const back = P.back !== undefined ? `openTopic(${P.back})` : "go('study')";
  const head = `<div class="top"><div><button class="speak" onclick="${back}"><i class="fas fa-arrow-left"></i> Back</button><h1 style="margin-top:10px">${esc(P.title)}</h1><div class="sub">${P.kind === "cards" ? "Flashcards" : "Practice quiz"} · ${Math.min(P.i + 1, P.items.length)} of ${P.items.length} · no grade</div></div></div>`;
  const steps = `<div class="steps">${P.items.map((_, k) => `<div class="${k < P.i ? (P.kind === "quiz" ? (P.res[k] ? "d" : "x") : "d") : k === P.i ? "c" : ""}"></div>`).join("")}</div>`;
  if (P.i >= P.items.length) {
    const good = P.kind === "quiz" ? P.score : P.known;
    return { main: head + `<div class="qwrap"><div class="qcard" style="text-align:center"><i class="fas fa-trophy" style="font-size:3rem;color:var(--gold)"></i><h2 style="margin:14px 0 6px">Done!</h2>
      <p style="color:var(--muted);font-size:1.05rem">${P.kind === "quiz" ? `You got ${good} of ${P.items.length} right.` : `You knew ${good} of ${P.items.length} words. The others will come back sooner.`} Your streak is now ${streak(S.prog.days)} day${streak(S.prog.days) === 1 ? "" : "s"}.</p>
      <div class="btnrow" style="justify-content:center"><button class="btn ghost" onclick="${back}">Back</button><button class="btn" onclick="${P.kind === "quiz" ? (P.back !== undefined ? `startQuiz(${P.back})` : "startMixedQuiz()") : (P.back !== undefined ? `startCards(${P.back})` : "startReview()")}">Practice again</button></div></div></div>`, aside: sideStats(), after: () => saveProgress(true) };
  }
  if (P.kind === "cards") {
    const w = P.items[P.i];
    return { main: head + `<div class="qwrap">${steps}<div class="flash" id="flash" onclick="this.classList.toggle('flip')"><div class="in">
      <div class="f"><div class="em">${esc(w.i || "📘")}</div><div class="term">${esc(w.t)}</div><p style="color:var(--muted);margin-top:12px">Do you know what it means? Tap to flip.</p></div>
      <div class="b"><div class="es">${esc(w.s)}</div><div>${esc(w.m)}</div>${w.e ? `<div class="ex">"${esc(w.e)}"</div>` : ""}</div></div></div>
      <div class="btnrow"><button class="speak" data-t="${esc(w.t)}" onclick="event.stopPropagation();speak(this.dataset.t)"><i class="fas fa-volume-high"></i> Listen</button>
       <div style="display:flex;gap:10px"><button class="btn red" onclick="cardAnswer(false)">Still learning</button><button class="btn green" onclick="cardAnswer(true)">I knew it</button></div></div></div>`, aside: sideStats() };
  }
  const q = P.items[P.i];
  return { main: head + `<div class="qwrap">${steps}<div class="qcard"><div class="lbl">Choose the right answer</div><h2>${esc(q.q)}</h2>
     ${q.opts.map((o, k) => `<button class="opt" id="o${k}" onclick="quizAnswer(${k})"><span class="k">${"ABCD"[k] || k + 1}</span>${esc(o.o)}</button>`).join("")}
     <div id="fb"></div><div class="btnrow"><span></span><button class="btn hidden" id="next" onclick="nextQ()">Continue</button></div></div></div>`, aside: sideStats() };
}
window.cardAnswer = (knew) => {
  const P = S.practice, w = P.items[P.i], k = wordKey(w);
  const cur = S.prog.boxes[k]?.b || 0; const b = knew ? Math.min(5, cur + 1) : 1;
  S.prog.boxes[k] = { b, d: addDays(today(), BOX_DAYS[b]) };
  if (knew) P.known++; countAnswer(knew); P.i++; render();
};
window.quizAnswer = (k) => {
  const P = S.practice, q = P.items[P.i]; if (P.locked) return; P.locked = true;
  const ok = q.opts[k].ok; P.res[P.i] = ok; if (ok) P.score++;
  q.opts.forEach((o, j) => { const el = $("o" + j); if (o.ok) el.classList.add("good"); else if (j === k) el.classList.add("bad"); el.disabled = true; });
  $("fb").innerHTML = `<div class="feedback" style="background:${ok ? "var(--green-l)" : "var(--red-l)"};color:${ok ? "#0d6b45" : "#8d2c2f"}">${ok ? "Correct!" : "Not this time."}${q.h ? " " + esc(q.h) : ""}</div>`;
  $("next").classList.remove("hidden"); countAnswer(ok);
};
window.nextQ = () => { S.practice.locked = false; S.practice.i++; render(); };

/* ---------- teacher pages ---------- */
async function loadStudents() {
  try { S.students = (await getDocs(collection(db, "progress"))).docs.map(d => ({ id: d.id, ...d.data() })); }
  catch (e) { S.students = []; toast("Could not read students (" + e.code + ")"); }
  if (S.mode === "teacher" && (S.view === "t-overview" || S.view === "t-students")) render();
}
function studentRows(list) {
  if (!list.length) return `<tr><td colspan="6" class="empty">Nobody has practiced yet. Use "View as student" or ask a student to sign in.</td></tr>`;
  return list.sort((a, b) => (b.lastActive?.seconds || 0) - (a.lastActive?.seconds || 0)).map(s => `<tr><td><b>${esc(s.name)}</b><br><small style="color:var(--muted)">${esc(s.email)}</small></td><td>${s.grade ? s.grade + "th" : "—"}</td><td>${s.lastActive ? s.lastActive.toDate().toLocaleDateString() : "—"}</td><td>${streak(s.days)}</td><td>${s.answered || 0}</td><td>${s.answered ? Math.round(100 * (s.correct || 0) / s.answered) + "%" : "—"}</td></tr>`).join("");
}
function teacherOverview() {
  if (!S.students) loadStudents();
  const list = S.students || [];
  const weekAgo = addDays(today(), -6);
  const active = list.filter(s => (s.days || []).some(d => d >= weekAgo)).length;
  return { main: `<div class="top"><div><h1>Overview</h1><div class="sub">${new Date().toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" })}</div></div></div>
   <div class="grid4">${[["Students signed in", S.students ? list.length : "…", "fa-users", "#1F5FD1", "#E3EDFF", ""], ["Practiced this week", S.students ? active : "…", "fa-fire", "#B7791F", "#FFF4DB", ""], ["Submitted on time", "87%", "fa-circle-check", "#16A36A", "#DDF6EA", "demo"], ["Missing work", "11", "fa-triangle-exclamation", "#E1484C", "#FDE4E4", "demo"]].map(x => `<div class="card kpi" style="display:flex;gap:14px;align-items:center"><div class="ic" style="background:${x[4]};color:${x[3]}"><i class="fas ${x[2]}"></i></div><div><b>${x[1]}</b><small>${x[0]} ${x[5] ? '<span class="demo">demo</span>' : ""}</small></div></div>`).join("")}</div>
   <div class="card"><div class="sec-t" style="margin-bottom:6px"><h3>Study zone activity</h3><span>real data from the pilot</span><button class="link" onclick="go('t-students')">See all</button></div>
    <div class="tscroll"><table><tr><th>Student</th><th>Grade</th><th>Last active</th><th>Streak</th><th>Answers</th><th>Correct</th></tr>${S.students ? studentRows(list.slice(0, 6)) : `<tr><td colspan="6" class="empty"><i class="fas fa-circle-notch fa-spin"></i></td></tr>`}</table></div></div>
   <div class="grid2">${activitiesCard(true)}${hardestCard()}</div>` };
}
function teacherStudents() {
  if (!S.students) loadStudents();
  return { main: `<div class="top"><div><h1>Students</h1><div class="sub">Everyone who has signed in and practiced</div></div><div class="right"><button class="btn ghost" onclick="S_reload()"><i class="fas fa-rotate"></i> Refresh</button></div></div>
   <div class="card tscroll"><table><tr><th>Student</th><th>Grade</th><th>Last active</th><th>Streak</th><th>Answers</th><th>Correct</th></tr>${S.students ? studentRows(S.students.slice()) : `<tr><td colspan="6" class="empty"><i class="fas fa-circle-notch fa-spin"></i></td></tr>`}</table></div>` };
}
window.S_reload = () => { S.students = null; render(); };
const DEMO_ACTS = [["Not Feeling Good · Block 2", "9A · 9B", "Mar 16, 6 pm → Mar 17, 6 pm", "51 / 70", true], ["Past Tense Lab · Block 2", "10A · 10B", "Mar 16, 6 pm → Mar 17, 6 pm", "60 / 72", true], ["Q1 · Final Exam", "9A · 9B", "Mar 25, 4:30 → 6:00 pm", "—", false], ["Q1 · Final Exam", "10A · 10B", "Mar 25, 4:30 → 6:00 pm", "—", false]];
function activitiesCard(short) {
  return `<div class="card"><div class="sec-t" style="margin-bottom:6px"><h3>Activities</h3><span>open and close without code</span><span class="demo">demo</span></div>
   <div class="tscroll"><table><tr><th>Activity</th>${short ? "" : "<th>Sections</th><th>Window</th>"}<th>Submitted</th><th>Open</th></tr>
   ${DEMO_ACTS.map((a, i) => `<tr><td><b>${a[0]}</b>${short ? `<br><small style="color:var(--muted)">${a[1]}</small>` : ""}</td>${short ? "" : `<td>${a[1]}</td><td>${a[2]}</td>`}<td>${a[3]}</td><td><button class="sw ${a[4] ? "" : "off"}" onclick="toggleAct(${i})" title="Open / close"></button></td></tr>`).join("")}</table></div></div>`;
}
window.toggleAct = (i) => { DEMO_ACTS[i][4] = !DEMO_ACTS[i][4]; toast(DEMO_ACTS[i][0] + (DEMO_ACTS[i][4] ? " opened" : " closed") + " (demo)"); render(); };
function hardestCard() {
  return `<div class="card"><div class="sec-t"><h3>Hardest questions</h3><span>% wrong</span><span class="demo">demo</span></div>
   ${[["Q7", 'Past of "catch"', 62, "#E1484C"], ["Q3", '"sore throat"', 48, "#E0861F"], ["Q9", "should vs. shouldn't", 41, "#E0861F"], ["Q2", '"headache"', 18, "#16A36A"], ["Q5", '"fever"', 12, "#16A36A"]].map(x => `<div class="hb"><span>${x[0]}</span><div style="width:140px;font-size:.82rem">${x[1]}</div><div class="t"><i style="width:${x[2]}%;background:${x[3]}"></i></div><span class="p">${x[2]}%</span></div>`).join("")}
   <small style="color:var(--muted)">Review Q7 in class on Monday.</small></div>`;
}
function teacherActivities() {
  return { main: `<div class="top"><div><h1>Activities</h1><div class="sub">Each unit with its sections, dates and status</div></div><div class="right"><button class="btn" onclick="toast('Coming next: create an activity from a form')"><i class="fas fa-plus"></i> New activity</button></div></div>${activitiesCard(false)}` };
}
function teacherResults() {
  return { main: `<div class="top"><div><h1>Results</h1><div class="sub">Grades by activity and the questions students miss most</div></div></div>
   <div class="grid2">${hardestCard()}<div class="card"><div class="sec-t"><h3>Average by section</h3><span class="demo">demo</span></div>
   ${[["9A", 7.9], ["9B", 8.4], ["10A", 7.1], ["10B", 8.0]].map(x => `<div class="hb"><span>${x[0]}</span><div class="t"><i style="width:${x[1] * 10}%;background:var(--blue)"></i></div><span class="p">${x[1]}</span></div>`).join("")}
   <button class="btn ghost" style="margin-top:12px" onclick="toast('Coming next: export to your Google Sheet')"><i class="fas fa-file-export"></i> Export to Sheets</button></div></div>` };
}
</script>
</body>
</html>
